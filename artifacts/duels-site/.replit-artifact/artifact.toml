kind = "web"
previewPath = "/"
title = "Duels Leaderboard"
version = "1.0.0"
id = "artifacts/duels-site"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23275

[services.development]
run = "pnpm --filter @workspace/duels-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/duels-site", "run", "build" ]
publicDir = "artifacts/duels-site/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23275"
BASE_PATH = "/"
